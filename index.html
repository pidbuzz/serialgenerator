<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Serial Generator</title>
<style>
  :root {
    --bg: #f3f4f8; --card: #ffffff; --text: #1d2233; --muted: #6b7185; --line: #dfe2ec;
    --accent: #3b5bdb; --accent-soft: #e8edff; --accent-text: #ffffff;
    --ok: #2b8a3e; --err: #c92a2a; --err-soft: #fff0f0; --field: #ffffff; --chip: #eef0f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --card: #1b1e2a; --text: #e8eaf2; --muted: #9197ad; --line: #2e3345;
      --accent: #748ffc; --accent-soft: #252c4a; --accent-text: #10131f;
      --ok: #69db7c; --err: #ff8787; --err-soft: #3a2024; --field: #151824; --chip: #262a3a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 60px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  .step { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-weight: 650; font-size: 1rem; }
  .step .num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
               display: inline-grid; place-items: center; font-size: .8rem; flex: none; }
  .step:not(:first-child) { margin-top: 24px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }

  input[type=text], input[type=number], select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--text); font-size: 1.05rem; font-family: inherit;
  }
  input#first { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.15rem; letter-spacing: .02em; }
  input:focus, select:focus, button:focus-visible, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .chips .lbl { font-size: .8rem; color: var(--muted); margin-right: 2px; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip);
          color: var(--text); font-size: .82rem; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .chip.plain { font-family: inherit; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mode { position: relative; }
  .mode input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .mode .box { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; height: 100%; background: var(--field); }
  .mode input:checked + .box { border-color: var(--accent); background: var(--accent-soft); }
  .mode input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mode b { display: block; font-size: .92rem; }
  .mode small { display: block; color: var(--muted); font-size: .78rem; margin: 2px 0 6px; }
  .mode code { font-size: .78rem; font-family: ui-monospace, Menlo, Consolas, monospace; }

  .preview { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--chip); font-size: .9rem; min-height: 46px; }
  .preview .tag { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }
  .preview .seq { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .98rem; word-break: break-all; }
  .preview .seq i { color: var(--muted); font-style: normal; padding: 0 6px; }
  .preview.bad { background: var(--err-soft); color: var(--err); }

  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .opts label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 4px; }

  .bar { display: flex; gap: 10px; margin-top: 22px; }
  button { font-family: inherit; font-size: .95rem; border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line);
           background: var(--field); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 650; flex: 1; font-size: 1rem; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger:hover { border-color: var(--err); color: var(--err); }

  .error { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--err-soft); color: var(--err); font-size: .9rem; }

  #results { display: none; }
  .res-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .res-head h2 { font-size: 1.05rem; margin: 0; }
  .res-head .range { color: var(--muted); font-size: .85rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .note { margin: 0 0 10px; padding: 8px 12px; border-radius: 8px; background: var(--err-soft); color: var(--err); font-size: .85rem; }
  textarea { width: 100%; height: 260px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
             background: var(--field); color: var(--text); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .95rem; }
  .res-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .res-actions .spacer { flex: 1; }

  @media (max-width: 560px) {
    .modes { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Batch Serial Generator</h1>
    <p>Type your first serial number, choose how many you need, and get the whole batch.</p>
  </header>

  <div class="card">
    <h2 class="step"><span class="num">1</span> First serial number</h2>
    <input type="text" id="first" placeholder="e.g. SN-000123" autocomplete="off" spellcheck="false" aria-label="First serial number">
    <div class="chips" id="examples">
      <span class="lbl">Try an example:</span>
      <button type="button" class="chip" data-v="SN-000123" data-m="number">SN-000123</button>
      <button type="button" class="chip" data-v="AAA9" data-m="odometer">AAA9</button>
      <button type="button" class="chip" data-v="0Z9" data-m="base36">0Z9</button>
      <button type="button" class="chip" data-v="1000001" data-m="number">1000001</button>
    </div>

    <h2 class="step"><span class="num">2</span> How should it count?</h2>
    <div class="modes" role="radiogroup" aria-label="Counting mode">
      <label class="mode">
        <input type="radio" name="mode" value="number" checked>
        <span class="box"><b>Numbers only</b><small>Letters stay fixed, digits count up</small><code>SN-009 → SN-010</code></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="odometer">
        <span class="box"><b>Letters + numbers</b><small>Digits roll 0-9, letters roll A-Z</small><code>AA9 → AB0</code></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="base36">
        <span class="box"><b>Base-36</b><small>0-9 then A-Z as one sequence</small><code>0Z9 → 0ZA</code></span>
      </label>
    </div>

    <div class="preview" id="preview" aria-live="polite">
      <span class="tag">Preview</span>
      <span class="seq" id="previewSeq">Start typing a serial number to see what comes next.</span>
    </div>

    <h2 class="step"><span class="num">3</span> How many?</h2>
    <input type="number" id="count" min="1" max="100000" value="50" aria-label="How many serials">
    <div class="chips">
      <button type="button" class="chip plain" data-c="10">10</button>
      <button type="button" class="chip plain" data-c="50">50</button>
      <button type="button" class="chip plain" data-c="100">100</button>
      <button type="button" class="chip plain" data-c="500">500</button>
      <button type="button" class="chip plain" data-c="1000">1,000</button>
    </div>

    <details>
      <summary>More options (step size, output format)</summary>
      <div class="opts">
        <div>
          <label for="step">Step (jump between serials)</label>
          <input type="number" id="step" min="1" value="1">
        </div>
        <div>
          <label for="sep">Output layout</label>
          <select id="sep">
            <option value="newline">One per line</option>
            <option value="comma">Comma separated</option>
            <option value="tab">Tab separated</option>
            <option value="space">Space separated</option>
          </select>
        </div>
      </div>
    </details>

    <div id="error" class="error" hidden></div>

    <div class="bar">
      <button type="button" class="primary" id="gen">Generate serials</button>
      <button type="button" class="danger" id="clear" title="Clear everything and start a new batch">Clear</button>
    </div>
  </div>

  <div class="card" id="results">
    <div class="res-head">
      <h2 id="resTitle">Your serials</h2>
      <span class="range" id="resRange"></span>
    </div>
    <div class="note" id="resNote" hidden></div>
    <textarea id="out" readonly aria-label="Generated serials"></textarea>
    <div class="res-actions">
      <button type="button" class="primary" id="copy" style="flex:none">Copy all</button>
      <button type="button" id="txt">Download .txt</button>
      <button type="button" id="csv">Download .csv</button>
      <span class="spacer"></span>
      <button type="button" class="danger" id="clear2">Clear results</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SEPS = { newline: '\n', comma: ',', tab: '\t', space: ' ' };
let list = [];

const getMode = () => document.querySelector('input[name=mode]:checked').value;
const setMode = m => { document.querySelector(`input[name=mode][value=${m}]`).checked = true; };

/* Core: returns {list, note, error} */
function build(first, count, step, mode) {
  if (!first) return { error: 'Enter the first serial number.' };
  const s = BigInt(step);
  const out = [];
  let note = '';

  if (mode === 'number') {
    const m = first.match(/^(.*?)(\d+)(\D*)$/);
    if (!m) return { error: 'Numbers-only mode needs at least one digit in the serial. Try "Letters + numbers" instead.' };
    const [, prefix, digits, suffix] = m;
    let n = BigInt(digits);
    for (let i = 0; i < count; i++) {
      out.push(prefix + String(n).padStart(digits.length, '0') + suffix);
      n += s;
    }
    return { list: out, note };
  }

  // Each letter/digit is a "wheel"; other characters (dashes etc.) stay fixed.
  const chars = first.split('');
  const pos = [];
  chars.forEach((c, i) => { if (/[0-9A-Za-z]/.test(c)) pos.push(i); });
  if (!pos.length) return { error: 'No letters or digits found in that serial.' };

  const isDigit = c => /[0-9]/.test(c);
  const upperGlobal = !/[a-z]/.test(first) || /[A-Z]/.test(first);
  const radix = i => mode === 'base36' ? 36 : (isDigit(chars[i]) ? 10 : 26);
  const toVal = i => {
    const c = chars[i];
    if (mode === 'base36') return parseInt(c, 36);
    return isDigit(c) ? +c : c.toLowerCase().charCodeAt(0) - 97;
  };
  const fromVal = (v, i) => {
    if (mode === 'base36') { const t = v.toString(36); return upperGlobal ? t.toUpperCase() : t; }
    if (isDigit(chars[i])) return String(v);
    return String.fromCharCode((chars[i] === chars[i].toUpperCase() ? 65 : 97) + v);
  };

  let n = 0n;
  for (const p of pos) n = n * BigInt(radix(p)) + BigInt(toVal(p));

  for (let i = 0; i < count; i++) {
    const arr = chars.slice();
    let rest = n;
    for (let k = pos.length - 1; k >= 0; k--) {
      const r = BigInt(radix(pos[k]));
      arr[pos[k]] = fromVal(Number(rest % r), pos[k]);
      rest /= r;
    }
    if (rest > 0n) { note = `Stopped early: this serial format ran out of room after ${out.length} serials.`; break; }
    out.push(arr.join(''));
    n += s;
  }
  return { list: out, note };
}

const readInputs = () => ({
  first: $('first').value.trim(),
  count: parseInt($('count').value, 10),
  step: Math.max(1, parseInt($('step').value, 10) || 1),
  mode: getMode()
});

/* Live preview */
function updatePreview() {
  const { first, step, mode } = readInputs();
  const box = $('preview'), seq = $('previewSeq');
  box.classList.remove('bad');
  if (!first) { seq.textContent = 'Start typing a serial number to see what comes next.'; return; }
  const r = build(first, 4, step, mode);
  if (r.error) { box.classList.add('bad'); seq.textContent = r.error; return; }
  seq.innerHTML = r.list.map(x => esc(x)).join('<i>→</i>') + '<i>…</i>';
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* Highlight selected count chip */
function markCount() {
  const v = $('count').value;
  document.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === v));
}

function showError(msg) { const e = $('error'); e.textContent = msg; e.hidden = !msg; }

function render() {
  $('out').value = list.join(SEPS[$('sep').value]);
}

function generate() {
  showError('');
  const { first, count, step, mode } = readInputs();
  if (!(count >= 1 && count <= 100000)) return showError('How many? Enter a number between 1 and 100,000.');
  const r = build(first, count, step, mode);
  if (r.error) return showError(r.error);

  list = r.list;
  render();
  $('resTitle').textContent = `${list.length.toLocaleString()} serial${list.length === 1 ? '' : 's'} generated`;
  $('resRange').textContent = list.length > 1 ? `${list[0]} → ${list[list.length - 1]}` : list[0];
  $('resNote').textContent = r.note;
  $('resNote').hidden = !r.note;
  $('results').style.display = 'block';
  $('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function clearAll() {
  list = [];
  $('out').value = '';
  $('first').value = '';
  $('results').style.display = 'none';
  showError('');
  updatePreview();
  $('first').focus();
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Events */
$('gen').onclick = generate;
$('clear').onclick = clearAll;
$('clear2').onclick = clearAll;
['first', 'step'].forEach(id => $(id).addEventListener('input', updatePreview));
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', updatePreview));
$('count').addEventListener('input', markCount);
$('sep').addEventListener('change', () => { if (list.length) render(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'radio') generate(); });

$('examples').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('first').value = b.dataset.v; setMode(b.dataset.m); updatePreview(); $('first').focus();
});
document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { $('count').value = b.dataset.c; markCount(); });

$('copy').onclick = async () => {
  const btn = $('copy'), text = $('out').value;
  try { await navigator.clipboard.writeText(text); }
  catch { $('out').select(); document.execCommand('copy'); }
  btn.textContent = 'Copied ✓';
  setTimeout(() => btn.textContent = 'Copy all', 1600);
};
$('txt').onclick = () => download('serials.txt', list.join('\n'), 'text/plain');
$('csv').onclick = () => download('serials.csv', 'Serial\n' + list.join('\n'), 'text/csv');

markCount();
updatePreview();
</script>
</body>
</html>
